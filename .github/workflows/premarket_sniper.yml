name: NSE Pre-Market Dislocation Sniper & GitHub Pages

on:
  schedule:
    # 09:08 AM IST is 03:38 UTC (Monday to Friday)
    # Market Call Auction completes clearing at 09:08:00 AM IST
    - cron: '38 3 * * 1-5'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'engine/**'
      - 'generate_dashboard.py'
      - 'detect_premarket_dislocations.py'
      - 'requirements.txt'

# Grant minimal necessary permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and newest
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quantitative verification tests
        run: |
          pytest
          python selftest.py

      - name: Run 9:08 AM Call Auction Scanner & Build Dashboard
        run: |
          python generate_dashboard.py --mode auto --output public/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
